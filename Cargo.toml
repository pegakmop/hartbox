[package]
name = "rvemu"
version = "0.1.0"
edition = "2021"
description = "Fast, CLI-driven RISC-V (RV64GC) full-system emulator that boots Linux and Alpine Linux"
publish = false

[[bin]]
name = "rvemu"
path = "src/main.rs"

[features]
counters = []

[dependencies]
clap = { version = "4", features = ["derive"] }
flate2 = "1"
tar = "0.4"
libc = "0.2"
smoltcp = { version = "0.12", default-features = false, features = ["std", "medium-ethernet", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp", "socket-icmp"] }

[profile.release]
debug = 1
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 2
