# Every function starts on its own 64-byte cache line. The block engine is thousands of
# tiny handlers that jump to each other, and with the compiler's default 4-byte
# alignment the front end of the CPU fetches across line boundaries and the branch
# predictor aliases neighbours: this alone was worth about 5 % on gcc and 3 % on sqlite.
#
# `apple-m1` is the oldest Apple silicon Mac, so the binary runs on all of them.
[target.aarch64-apple-darwin]
rustflags = ["-C", "llvm-args=-align-all-functions=6", "-C", "target-cpu=apple-m1"]
